services:
  avito-review-service:
      build: .
      container_name: avito-review-service
      environment:
        SERVER_PORT: 8080
        POSTGRES_PASSWORD: toor
      ports:
        - "8080:8080"
      depends_on:
        db:
            condition: service_healthy
      networks:
        - internal

  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: review
      POSTGRES_PASSWORD: toor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d review'"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - internal

networks:
  internal:
